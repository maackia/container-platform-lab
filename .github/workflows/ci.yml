name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: "v4.2.3"
  KUBECONFORM_VERSION: "0.8.0"
  KUBE_PROMETHEUS_STACK_VERSION: "87.19.0"

jobs:
  validate-kubernetes:
    name: Validate Kubernetes monitoring configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Grafana dashboard resource
        run: |
          jq -e '
            .apiVersion == "dashboard.grafana.app/v2" and
            .kind == "Dashboard" and
            (.metadata.name | length > 0) and
            .spec.title == "Platform App Overview"
          ' grafana/dashboards/platform-app-overview.json

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            "ghcr.io/yannh/kubeconform:v${KUBECONFORM_VERSION}" \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/k8s

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Pull and render monitoring chart
        run: |
          chart_dir="${RUNNER_TEMP}/helm-chart"
          chart_archive="${chart_dir}/kube-prometheus-stack-${KUBE_PROMETHEUS_STACK_VERSION}.tgz"
          rendered_file="${RUNNER_TEMP}/kube-prometheus-stack-rendered.yaml"

          mkdir -p "$chart_dir"

          helm pull \
            oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack \
            --version "$KUBE_PROMETHEUS_STACK_VERSION" \
            --destination "$chart_dir"

          test -f "$chart_archive"

          helm lint \
            "$chart_archive" \
            -f helm/kube-prometheus-stack-values.yaml

          helm template monitoring \
            "$chart_archive" \
            --namespace monitoring \
            -f helm/kube-prometheus-stack-values.yaml \
            > "$rendered_file"

      - name: Validate rendered monitoring manifests
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP:/work:ro" \
            "ghcr.io/yannh/kubeconform:v${KUBECONFORM_VERSION}" \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /work/kube-prometheus-stack-rendered.yaml

  test:
    name: Validate and test container stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Check application syntax
        working-directory: app
        run: node --check server.js

      - name: Create environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Compose images
        run: docker compose build

      - name: Start Compose services
        run: docker compose up -d

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            response="$(curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              http://localhost:8080/health 2>/dev/null || true)"

            if [ -n "$response" ]; then
              echo "$response"
              echo "Application is healthy"
              exit 0
            fi

            echo "Waiting for application... attempt ${i}/30"
            sleep 3
          done

          echo "Application did not become healthy"
          exit 1

      - name: Check application response
        run: |
          response="$(curl \
            --silent \
            --show-error \
            --fail \
            --connect-timeout 2 \
            --max-time 5 \
            http://localhost:8080/)"

          echo "$response"

          if [ -z "$response" ]; then
            echo "Application returned an empty response"
            exit 1
          fi

      - name: Wait for Prometheus readiness
        run: |
          for i in {1..30}; do
            if curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              http://localhost:9090/-/ready; then

              echo
              echo "Prometheus is ready"
              exit 0
            fi

            echo "Waiting for Prometheus... attempt ${i}/30"
            sleep 3
          done

          echo "Prometheus did not become ready"
          exit 1

      - name: Wait for Prometheus target
        run: |
          for i in {1..30}; do
            response="$(curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              'http://localhost:9090/api/v1/query?query=up%7Bjob%3D%22node_app%22%7D' \
              2>/dev/null || true)"

            echo "$response"

            if echo "$response" | grep -Eq '"value":\[[^]]*,"1"\]'; then
              echo "Prometheus target is up"
              exit 0
            fi

            echo "Waiting for Prometheus target... attempt ${i}/30"
            sleep 3
          done

          echo "Prometheus target did not become healthy"
          exit 1

      - name: Wait for Grafana health
        run: |
          for i in {1..30}; do
            response="$(curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              http://localhost:3001/api/health \
              2>/dev/null || true)"

            echo "$response"

            if echo "$response" |
              grep -Eq '"database"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Grafana is healthy"
              exit 0
            fi

            echo "Waiting for Grafana... attempt ${i}/30"
            sleep 3
          done

          echo "Grafana did not become healthy"
          exit 1

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop Compose services
        if: always()
        run: docker compose down -v --remove-orphans
