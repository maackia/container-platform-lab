apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: platform-discord
  namespace: monitoring
  labels:
    alertmanagerConfig: platform-discord
spec:
  route:
    receiver: discord-platform
    groupBy:
      - namespace
      - alertname
    groupWait: 10s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: service
        value: platform-app
        matchType: "="

  receivers:
    - name: discord-platform
      discordConfigs:
        - apiURL:
            name: alertmanager-discord-webhook
            key: webhook-url
          sendResolved: true
          username: Platform Alertmanager
