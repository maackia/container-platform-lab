apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blog
  namespace: blog
  labels:
    release: monitoring

spec:
  namespaceSelector:
    matchNames:
      - blog
  selector:
    matchLabels:
      app: blog
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
